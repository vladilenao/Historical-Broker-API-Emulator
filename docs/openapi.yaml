openapi: 3.0.3
info:
  title: Historical Broker API Emulator
  version: "0.1.0"
  description: |
    Целевой контракт исторических рыночных данных. Главный ресурс — инструмент,
    публичный ключ — instrument_type + ticker. Свечи и покрытие подчинены ему;
    downloads представляет процесс получения данных одного или многих инструментов.

    Публичная форма чтения реализована по типу и тикеру. Переход клиента робота
    остаётся отдельной согласованной миграцией.
    Замечания к действующему контракту — docs/implemented-api-contract-audit.md.

    ## Общие правила

    * **Время — наивный UTC.** Все `datetime`, включая `from`/`to` и `*_candle_date`,
      сериализуются как `YYYY-MM-DD HH:MM:SS` без таймзоны. Значения со смещением
      (`Z`, `±hh:mm`) конвертируются в UTC. Исключения — моменты карточки
      фьючерса `expiration_date`, `first_trade_date` и `last_trade_date`:
      ISO 8601 со смещением `+00:00`.
    * **Строки свечей** повторяют поля и порядок робота:
      `datetime, open, high, low, close, volume`.
    * **Границы `from`/`to` включительны** (`[from, to]`).
    * **Интервалы:** `1m, 5m, 15m, 30m, 1h, 4h, 1d, 1w, 1M`.
    * **Типы инструментов:** `share, future, etf, currency`.
    * **Публичная идентификация:** тип и тикер во всех целевых запросах и ответах.
       UID/FIGI разрешает сервис; они не являются клиентскими параметрами.
       Действующая диагностика market-import мигрирует отдельно.
    * **Совместимость My_roBot:** маршруты совместимости по UID сохранены и строго
      соответствуют используемому контракту Tinkoff API. Их путь, параметры,
      тела запросов и форма ответов менять нельзя; новые возможности добавляются
      только в type+ticker API.
      `GET /api/v1/instruments` без `api_version=2` возвращает прежний массив;
      новая объектная форма каталога требует `api_version=2`. Остальные новые
      операции type+ticker не требуют параметра версии.
    * **Формат ошибки** единый:
      `{"error": {"code": "...", "message": "..."}}`. HTTP-код 422 не используется;
      ошибки валидации отдаются как 400 с кодом `VALIDATION_ERROR`.
    * **Чтение (`candles`, `coverage`, `instruments`) офлайн** и не обращается к
      Tinkoff. **Создание, предпросмотр и повтор загрузки требуют настроенного
      доступа к Tinkoff**; без него — 401 `AUTHENTICATION_ERROR`.
      Журнал, результаты и отмена не требуют обращения к поставщику.
    * **Продолжение страниц** — по `_links.next`; клиент не вычисляет курсоры.
      Снимок чтения — непрозрачная строка snapshot, а не номер генерации БД.
    * **RMM ≥ 3:** ресурсы instruments и downloads отдают гипермедиа `_links`.
      Формат ссылок — вложенный JSON в `application/json` (не строгий HAL).
    * **Статус реализации:** каждая операция помечена vendor-расширением
       `x-status: implemented` (операция доступна в коде) или `x-status: planned`
        (операция проектируется).

    ## Проектные документы

    Логика выбора контрактов, инкрементальной догрузки и модель данных описаны в
    `docs/futures-backfill-service-design.md`.
servers:
  - url: http://127.0.0.1:8100
    description: Локальный эмулятор (значение по умолчанию)
tags:
  - name: health
    description: Проверка живости сервиса.
  - name: instruments
    description: Главный ресурс — инструмент по типу и тикеру; карточка, свечи, покрытие и батчевое чтение. Read-only.
  - name: downloads
    description: Загрузка свечей акций и фьючерсов по тикеру, а также серий фьючерсов по базовому активу; отчёт о результате. Требует токен для создания загрузки.
  - name: market-import
    description: Состояние импорта изменений My Robot и внеочередная синхронизация.
  - name: root
    description: Корневой ресурс со ссылками на коллекции.
  - name: tinkoff-compatibility
    description: Неизменяемые UID-маршруты, совместимые с используемым Tinkoff API.
  - name: history
    description: Сводка локального хранилища — что скачано, с какой по какую дату и где пропуски. Read-only, без обращения к Tinkoff.
  - name: data-quality
    description: Офлайн-отчёт качества истории на снимке; паузы не являются доказанными потерями данных.

paths:
  /api/v1/history/data-quality/report:
    post:
      tags: [data-quality]
      operationId: historyDataQualityReport
      x-status: implemented
      summary: Отчёт качества истории на снимке
      description: |
        Отдельный офлайн SQL-анализ истории по типу и тикеру. Возвращает границы,
        количество свечей, достаточность закрытого прогрева, дефекты OHLC,
        объёма и временных меток, а также наблюдаемые паузы между свечами.
        Не загружает историю у брокера, не возвращает OHLCV и не изменяет /coverage.

        Границы from/to включительны. Дата без времени в to означает конец дня.
        Каждый таймфрейм проверяется независимо. Месячный интервал учитывается
        календарно. Отрицательная цена сама по себе не является дефектом.

        Паузы — наблюдения, а не подтверждённые потери торговых свечей.
        Без календаря и подтверждения причин отсутствия свечей completeness
        всегда unknown. Статус ready не выдаётся: not_ready означает отсутствие
        данных, дефекты, недостаточный прогрев или ошибку пары; warning —
        наблюдаемые паузы или неподтверждённые края; unknown — отсутствие
        обнаруженных проблем при неподтверждённой полноте.

        Один snapshot фиксирует каталог и версии свечей для всего батча.
        Без snapshot создаётся новый; вернувшийся токен нужно передать в
        последующее публичное чтение. Снимки недействительны после перезапуска.

        Счётчики охватывают весь диапазон; примеры ограничены sample_limit,
        паузы сортируются от наиболее длинных. При HTTP 200 проверяйте status
        и issues каждой пары. Ошибка отдельного диапазона, отсутствующий или
        неоднозначный инструмент не мешают получить остальные результаты.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualityReportRequest"
            examples:
              single:
                summary: Проверить часовые свечи и два бара прогрева
                value:
                  requests:
                    - instrument_type: share
                      ticker: SBER
                      interval: 1h
                      from: "2025-01-15T10:00:00Z"
                      to: "2025-01-15T18:59:59Z"
                      warmup_bars: 2
                  sample_limit: 20
              batch:
                summary: Несколько таймфреймов на ранее полученном снимке
                value:
                  snapshot: rs_example
                  requests:
                    - {instrument_type: share, ticker: SBER, interval: 1m, from: "2025-01-01", to: "2025-12-21", warmup_bars: 1}
                    - {instrument_type: share, ticker: SBER, interval: 1h, from: "2025-01-01", to: "2025-12-21", warmup_bars: 50}
                  sample_limit: 10
      responses:
        "200":
          description: Отчёт построен; статус и проблемы находятся в результатах.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityReportResponse"
              example:
                report_version: 1
                snapshot: rs_example
                status: warning
                count: 1
                results:
                  - instrument_type: share
                    ticker: SBER
                    interval: 1h
                    requested_from: "2025-01-15 10:00:00"
                    requested_to: "2025-01-15 18:59:59"
                    status: warning
                    completeness: unknown
                    first: "2025-01-15 10:00:00"
                    last: "2025-01-15 18:00:00"
                    count: 8
                    warmup: {required: 2, available: 2, invalid_count: 0, satisfied: true}
                    invalid_count: 0
                    invalid_samples: []
                    invalid_samples_truncated: false
                    pause_count: 1
                    longest_pause_seconds: 3600
                    pauses:
                      - {previous: "2025-01-15 12:00:00", following: "2025-01-15 14:00:00", pause_from: "2025-01-15 13:00:00", duration_seconds: 3600}
                    pauses_truncated: false
                    issues:
                      - {code: COMPLETENESS_UNKNOWN, message: "Полнота не подтверждена без календаря и причин отсутствия свечей.", count: null}
                      - {code: OBSERVED_PAUSES, message: "Пауза может быть торговым перерывом или отсутствием сделок.", count: 1}
        "400":
          description: Некорректное тело (VALIDATION_ERROR) или неизвестный snapshot (INVALID_SNAPSHOT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Внутренняя ошибка; не выдаётся как положительный результат проверки.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /health:
    get:
      tags: [health]
      summary: Проверка здоровья
      description: Фиксированный ответ, что сервис работает.
      operationId: getHealth
      x-status: implemented
      responses:
        "200":
          description: Сервис работает.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example: {status: ok}

  /api/v1/:
    get:
      tags: [root]
      summary: Корневой ресурс
      description: |
        Точка входа с гипермедиа-ссылками на коллекции (RMM ≥ 3). Клиент не
        собирает адреса вручную, а идёт по `_links`.
      operationId: getRoot
      x-status: implemented
      responses:
        "200":
          description: Ссылки на ресурсы.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinksDocument"
              example:
                _links:
                  self: {href: /api/v1/}
                  instruments: {href: "/api/v1/instruments?api_version=2"}
                  candles_batch: {href: /api/v1/instruments/candles/batch, method: POST}
                  selection: {href: /api/v1/history/downloads/selection, method: POST}
                  downloads: {href: /api/v1/history/downloads}
                  data_quality: {href: /api/v1/history/data-quality/report, method: POST}
                  inventory: {href: /api/v1/history/inventory}

  /api/v1/instruments/{instrument_type}/{ticker}/candles:
    get:
      tags: [instruments]
      summary: Свечи инструмента по типу и тикеру
      description: |
        Сохранённые свечи инструмента в диапазоне [from, to], по возрастанию
        datetime. Тип и тикер разрешает сервис; UID/FIGI клиент не передаёт.
        Неизвестный инструмент — 404, неоднозначная пара — 409. Пустой список
        означает отсутствие сохранённых свечей для уже найденного инструмента.
        Read-only, без скачивания из Tinkoff.

        Для продолжения используется _links.next, которая сохраняет параметры
        и снимок чтения. next_cursor непрозрачен; клиент его не разбирает.
        snapshot фиксирует данные и соответствие тикеров инструментам на весь
        просмотр; без параметра сервер создаёт снимок и возвращает его в ответе.
        Этот же snapshot можно передавать в чтении других инструментов и покрытия.
        total заполняется при хотя бы одной границе, иначе null.

        Дата без времени в from — начало дня UTC, в to — конец дня (23:59:59).
        После нормализации from должен быть раньше to. Точность — целые секунды.
      operationId: getInstrumentCandles
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/InstrumentTypePath"
        - $ref: "#/components/parameters/TickerPath"
        - name: interval
          in: query
          required: true
          description: Интервал свечей.
          schema:
            $ref: "#/components/schemas/Interval"
          example: 1h
        - name: from
          in: query
          required: false
          description: |
            Начальная граница включительно; дата без времени — начало дня UTC.
          schema:
            $ref: "#/components/schemas/ReadTimeBound"
          example: "2024-01-01T00:00:00"
        - name: to
          in: query
          required: false
          description: Конечная граница включительно; дата без времени включает весь день UTC.
          schema:
            $ref: "#/components/schemas/ReadTimeBound"
          example: "2024-12-31T23:59:00"
        - name: limit
          in: query
          required: false
          description: Число свечей в ответе. От 1 до 200000.
          schema:
            type: integer
            minimum: 1
            maximum: 200000
            default: 20000
        - name: cursor
          in: query
          required: false
          description: Непрозрачное продолжение страницы; предпочтительно следовать _links.next.
          schema:
            type: string
            nullable: true
          example: opaque-candles-token
        - $ref: "#/components/parameters/ReadSnapshot"
      responses:
        "200":
          description: Свечи найдены (возможно, пустой список).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandlesResponse"
              example:
                instrument_type: share
                ticker: SBER
                interval: 1h
                range: {from: "2024-01-01 00:00:00", to: "2024-01-01 02:00:00"}
                snapshot: opaque-read-snapshot
                count: 2
                total: 2
                next_cursor: null
                candles:
                  - {datetime: "2024-01-01 00:00:00", open: 100.0, high: 101.0, low: 99.0, close: 100.5, volume: 1000}
                  - {datetime: "2024-01-01 01:00:00", open: 100.5, high: 102.0, low: 100.0, close: 101.0, volume: 2000}
                _links:
                  self: {href: "/api/v1/instruments/share/SBER/candles?interval=1h&from=2024-01-01&to=2024-01-01T02:00:00&snapshot=opaque-read-snapshot"}
                  instrument: {href: "/api/v1/instruments/share/SBER?snapshot=opaque-read-snapshot"}
        "400":
          $ref: "#/components/responses/InstrumentReadBadRequest"
        "404":
          $ref: "#/components/responses/InstrumentReadNotFound"
        "409":
          $ref: "#/components/responses/InstrumentReadAmbiguous"
        "503":
          $ref: "#/components/responses/InstrumentReadMetadataPending"
  /api/v1/instruments/candles/batch:
    post:
      tags: [instruments]
      summary: Свечи нескольких инструментов по типам и тикерам
      description: |
        Свечи сразу для списка инструментов и интервалов. Каждый подзапрос содержит
        instrument_type и ticker. Все результаты читаются из одного снимка;
        snapshot передаётся на уровне батча или создаётся сервером.

        Результаты лежат в `results` **строго в порядке `requests`**, сопоставление —
        по индексу. Ошибка одного подзапроса не отменяет остальные: она в поле
        `error` этого элемента, а HTTP-статус остаётся 200. Ошибки всего запроса —
        неверная структура тела, превышение лимита подзапросов или непригодный
        общий snapshot (400). Неверный интервал, тип, строка даты, период,
        неизвестный/неоднозначный тикер и ошибка продолжения обрабатываются
        поэлементно. Для продолжения каждого результата используется его _links.next.
      operationId: postCandlesBatch
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandleBatchRequest"
            example:
              requests:
                - {instrument_type: share, ticker: SBER, interval: 1m, from: "2024-01-01T00:00:00", to: "2024-01-02T00:00:00"}
                - {instrument_type: future, ticker: NG-1.26, interval: 1d, from: "2025-11-01", to: "2025-12-31"}
      responses:
        "200":
          description: Результат по каждому подзапросу, в порядке запроса.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandleBatchResponse"
              example:
                count: 2
                snapshot: opaque-read-snapshot
                results:
                  - instrument_type: share
                    ticker: SBER
                    interval: 1m
                    range: {from: "2024-01-01 00:00:00", to: "2024-01-01 01:00:00"}
                    count: 1
                    total: 1
                    next_cursor: null
                    candles:
                      - {datetime: "2024-01-01 00:00:00", open: 100.0, high: 101.0, low: 99.0, close: 100.5, volume: 1000}
                    error: null
                    _links: {instrument: {href: "/api/v1/instruments/share/SBER?snapshot=opaque-read-snapshot"}}
                  - instrument_type: future
                    ticker: NG-1.26
                    interval: 2h
                    range: null
                    count: 0
                    total: null
                    next_cursor: null
                    candles: []
                    error:
                      code: INVALID_INTERVAL
                      message: "Неподдерживаемый таймфрейм '2h'."
                    _links: {}
        "400":
          description: Некорректное тело запроса или превышен лимит подзапросов (256).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: {code: VALIDATION_ERROR, message: Проверка запроса не пройдена.}

  /api/v1/instruments/{instrument_type}/{ticker}/coverage:
    get:
      tags: [instruments]
      summary: Доступность сохранённой истории инструмента
      description: |
        Статистика и проверка доступной сохранённой истории без выгрузки свечей.
        requested_range — нормализованные границы запроса; available_range —
        крайние имеющиеся свечи внутри диапазона, либо null при count=0.
        status=complete допустим только при подтверждённой полноте; крайние свечи
        и количество сами по себе не являются доказательством. Иначе unknown,
        partial или missing с понятной причиной. slots и внутренние генерации
        не публикуются. Информационный ресурс не управляет алгоритмом загрузки.
        Поддерживает тот же snapshot и семантику дат, что чтение свечей. Read-only.
      operationId: getInstrumentCoverage
      x-status: implemented
      parameters:
        - $ref: "#/components/parameters/InstrumentTypePath"
        - $ref: "#/components/parameters/TickerPath"
        - name: interval
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Interval"
          example: 5m
        - name: from
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ReadTimeBound"
          example: "2023-01-01T00:00:00"
        - name: to
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ReadTimeBound"
          example: "2025-01-01T00:00:00"
        - $ref: "#/components/parameters/ReadSnapshot"
      responses:
        "200":
          description: "Покрытие определено (возможно, `count: 0`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverageResponse"
              example:
                instrument_type: share
                ticker: SBER
                interval: 5m
                requested_range: {from: "2023-01-01 00:00:00", to: "2025-01-01 00:00:00"}
                available_range: {from: "2023-01-02 09:35:00", to: "2024-12-31 18:50:00"}
                count: 208431
                status: unknown
                snapshot: opaque-read-snapshot
                reason: {code: COVERAGE_NOT_CONFIRMED, message: Полнота истории пока не подтверждена.}
                _links:
                  self: {href: "/api/v1/instruments/share/SBER/coverage?interval=5m&from=2023-01-01&to=2025-01-01T00:00:00&snapshot=opaque-read-snapshot"}
                  candles: {href: "/api/v1/instruments/share/SBER/candles?interval=5m&from=2023-01-01&to=2025-01-01T00:00:00&snapshot=opaque-read-snapshot"}
        "400":
          $ref: "#/components/responses/InstrumentReadBadRequest"
        "404":
          $ref: "#/components/responses/InstrumentReadNotFound"
        "409":
          $ref: "#/components/responses/InstrumentReadAmbiguous"
        "503":
          $ref: "#/components/responses/InstrumentReadMetadataPending"

  /api/v1/instruments:
    get:
      tags: [instruments]
      summary: Поиск сохранённых инструментов
      description: |
        Общий каталог с фильтрами ticker и instrument_type. Без `api_version=2`
        возвращается UID-представление, совместимое с Tinkoff API. С `api_version=2`
        UID и FIGI не являются публичными идентификаторами. Сервис обеспечивает однозначную карточку
        для каждой пары типа и тикера; конфликт не скрывается случайным выбором.
        Только сохранённые метаданные, без обращения к Tinkoff.

        Представление версии 2 — объект с instruments, count, total, snapshot и _links.
        total учитывает все фильтры. Листание — по _links.next без offset и
        вычисления курсоров. Снимок фиксирует состав каталога и соответствие
        публичных тикеров внутренним инструментам.
      operationId: findInstruments
      x-status: implemented
      parameters:
        - name: ticker
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PublicTicker"
          example: SBER
        - name: api_version
          in: query
          required: false
          description: |
            `2` выбирает объект InstrumentList этого контракта. При отсутствии
            параметра возвращается Tinkoff-совместимый UID-массив для My_roBot.
          schema: {type: integer, enum: [2]}
        - name: instrument_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/InstrumentType"
          example: future
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 5000, default: 5000}
        - name: cursor
          in: query
          required: false
          description: Непрозрачное продолжение из предыдущего ответа; используйте _links.next.
          schema: {type: string}
        - $ref: "#/components/parameters/ReadSnapshot"
      responses:
        "200":
          description: Подходящие инструменты (возможно, пустой список).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InstrumentList"
                  - type: array
                    items:
                      $ref: "#/components/schemas/TinkoffInstrument"
              example:
                count: 1
                total: 2
                snapshot: opaque-read-snapshot
                next_cursor: opaque-instruments-token
                instruments:
                  - ticker: SBER
                    instrument_type: share
                    name: Сбербанк
                    currency: RUB
                    lot: 10
                    min_price_increment: 0.01
                    expiration_date: null
                    basic_asset: null
                    basic_asset_size: null
                    first_trade_date: null
                    last_trade_date: null
                    _links:
                      self: {href: "/api/v1/instruments/share/SBER?snapshot=opaque-read-snapshot"}
                      candles: {href: "/api/v1/instruments/share/SBER/candles?interval=1d&snapshot=opaque-read-snapshot"}
                      coverage: {href: "/api/v1/instruments/share/SBER/coverage?interval=1d&snapshot=opaque-read-snapshot"}
                _links:
                  self: {href: "/api/v1/instruments?api_version=2&instrument_type=share&limit=1&snapshot=opaque-read-snapshot"}
                  next: {href: "/api/v1/instruments?api_version=2&instrument_type=share&limit=1&snapshot=opaque-read-snapshot&cursor=opaque-instruments-token"}
        "400":
          $ref: "#/components/responses/InstrumentReadBadRequest"
        "409":
          $ref: "#/components/responses/InstrumentReadAmbiguous"

