  /api/v1/trading-schedules:
    get:
      tags: [tinkoff-compatibility]
      summary: Расписание торгов инструмента на снимке
      description: |
        UID-маршрут, который уже вызывает исторический режим My_roBot
        (`EmulatorScheduleSource`). Это исключение из правила «новое — только в
        type+ticker API»: форма ответа задана действующим клиентом робота.

        Источники — лента `trading-schedules` экспорта My Robot и дни,
        восстановленные эмулятором по правилам сессий (CLI
        `reconstruct-schedules`) для прошедших дат, которых брокер не отдаёт.
        Для каждой торговой даты (МСК) между `from` и `to` включительно
        отдаётся последняя видимая в снимке версия дня из ленты, а если её нет —
        восстановленная (`provenance: reconstructed`, `rules_version`,
        `source: emulator-reconstructed`). Режим торгов определяется по привязке
        UID с тем же приоритетом (`binding_provenance`). В `missing_dates` —
        только даты без того и другого.

        `version` — sha256 канонического JSON исходного TradingDay, `day` — сам
        TradingDay без изменений: робот пересчитывает версию и сверяет её.
        С `snapshot_generation` ответ закреплён за снимком из
        `POST /api/v1/market-import/sync` и возвращает тот же номер; без
        параметра используется текущее поколение.
      operationId: getLegacyTradingSchedules
      x-status: implemented
      parameters:
        - name: instrument_id
          in: query
          required: true
          schema: {type: string, minLength: 1}
          description: UID инструмента.
        - name: from
          in: query
          required: true
          schema: {type: string}
          description: Начало диапазона, UTC (`YYYY-MM-DD HH:MM:SS`, ISO 8601 или дата). Переводится в торговую дату МСК.
        - name: to
          in: query
          required: true
          schema: {type: string}
          description: Конец диапазона включительно, UTC. Диапазон — не длиннее 366 торговых дат.
        - name: snapshot_generation
          in: query
          required: false
          schema: {type: integer, minimum: 0}
          description: Номер снимка из POST /api/v1/market-import/sync; не больше текущего.
      responses:
        "200":
          description: Дни расписания и даты без расписания. Без привязки UID `exchange` равен null, а `days` пуст.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingScheduleResponse"
              example:
                instrument_id: uid-sber
                exchange: moex_mrng_evng_e_wknd_dlr
                binding_provenance: my_robot_export
                from: "2026-10-08"
                to: "2026-10-10"
                snapshot_generation: 42
                days:
                  - trading_date: "2026-10-09"
                    exchange: moex_mrng_evng_e_wknd_dlr
                    version: 644baa41f9ef0c6c1b1f5e8d3a7a2b9c4d0e1f2a3b4c5d6e7f8091a2b3c4d5e6
                    is_trading_day: true
                    source: tbank
                    provenance: my_robot_export
                    rules_version: null
                    observed_at: "2026-10-09T05:00:00.000000Z"
                    last_confirmed_at: "2026-10-09T05:00:00.000000Z"
                    day:
                      date: "2026-10-09T00:00:00.000000Z"
                      is_trading_day: true
                      start_time: "2026-10-09T06:50:00.000000Z"
                      end_time: "2026-10-09T20:50:00.000000Z"
                      intervals: []
                missing_dates: ["2026-10-08", "2026-10-10"]
        "400":
          description: |
            `INVALID_TIME_RANGE` — from позже to или диапазон длиннее 366 дней;
            `INVALID_SNAPSHOT` — snapshot_generation больше текущего;
            `VALIDATION_ERROR` — некорректные параметры.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`INSTRUMENT_NOT_FOUND` — UID нет ни в каталоге, ни в привязках расписаний."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

