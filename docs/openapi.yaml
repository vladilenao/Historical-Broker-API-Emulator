  /api/v1/history/inventory:
    get:
      tags: [history]
      summary: Сводка хранилища
      description: |
        Что лежит в локальной базе: семейства фьючерсов (по коду серии) и акции,
        первая и последняя свеча интервала, отставание от текущего момента,
        пропуски контрактной цепочки и момент, с которого история пригодна для
        прогона робота. Только чтение локальной базы, без обращения к Tinkoff;
        строки свечей не считаются — границы берутся по индексу.

        * `code` фьючерса — код серии (`NG`, `Si`): то же значение принимает
          `target.base_asset` загрузки. `name` — базовый актив карточки
          (`basic_asset`). У акции `code` — тикер.
        * `lag_days` — целые календарные сутки от `last_candle` до `as_of`.
        * `gaps` — участки цепочки, где у основного на тот момент контракта нет
          свечей интервала (рубеж смены — за 2 суток до конца обращения, как у
          робота). Границы уточняются по соседним контрактам: `from` — последняя
          свеча, заходящая в пропуск слева (или рубеж смены), `to` — первая
          свеча контракта, который продолжается после пропуска. Ищутся только
          между первой и последней свечой цепочки, короче 7 суток не считаются;
          отставание после последней свечи показывает `lag_days`. Дыры внутри
          одного контракта или акции здесь не ищутся (см. data-quality).
        * `usable_from` — с какого момента у семейства есть основной контракт и
          его минутные свечи; то же значение печатает `historical-broker verify`.
          Не зависит от `interval`. У акций и у серий, которые робот не
          строит цепочкой, — `null`.
        * `status` контракта: `full` — свечи покрывают обращение от первой
          доступной у поставщика свечи до min(конец обращения, `as_of`) с допуском
          7 суток на края (край, за который загрузка уже завершена, тоже
          считается покрытым); `partial` — свечи есть, но не на всём обращении;
          `none` — свечей интервала нет. `is_current` — основной контракт
          цепочки в момент `as_of`.
      operationId: getHistoryInventory
      x-status: implemented
      parameters:
        - name: interval
          in: query
          required: false
          schema:
            allOf:
              - $ref: "#/components/schemas/Interval"
            default: 1m
          description: Интервал свечей, по которому строится сводка.
        - name: instrument_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DownloadInstrumentType"
          description: Только фьючерсы или только акции; по умолчанию — оба типа.
      responses:
        "200":
          description: Сводка хранилища.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryInventory"
              example:
                interval: 1m
                as_of: "2026-11-21T12:00:00+00:00"
                snapshot: rs_q3Vb2Nf8kX1pLm0Ztc7aRw2e
                instruments:
                  - code: NG
                    instrument_type: future
                    name: Газ (США)
                    contracts_total: 70
                    contracts_with_candles: 52
                    first_candle: "2021-01-25T07:24:00+00:00"
                    last_candle: "2026-10-01T20:49:00+00:00"
                    lag_days: 50
                    gaps:
                      - from: "2025-09-26T08:04:00+00:00"
                        to: "2026-09-02T03:59:00+00:00"
                    usable_from: "2021-06-28T04:00:00+00:00"
                    contracts:
                      - ticker: NGV6
                        short_name: NG-10.26
                        first_trade_date: "2026-03-19T07:00:00+00:00"
                        expiration_date: "2026-10-29T00:00:00+00:00"
                        first_candle: "2026-09-02T03:59:00+00:00"
                        last_candle: "2026-10-01T20:49:00+00:00"
                        status: partial
                        is_current: false
                      - ticker: NGX6
                        short_name: NG-11.26
                        first_trade_date: "2026-04-20T07:00:00+00:00"
                        expiration_date: "2026-11-26T00:00:00+00:00"
                        first_candle: null
                        last_candle: null
                        status: none
                        is_current: true
                  - code: SBER
                    instrument_type: share
                    name: Сбербанк
                    contracts_total: null
                    contracts_with_candles: null
                    first_candle: "2022-01-03T03:59:00+00:00"
                    last_candle: "2026-09-27T20:49:00+00:00"
                    lag_days: 54
                    gaps: []
                    usable_from: null
                    contracts: []
                _links:
                  self: {href: "/api/v1/history/inventory?interval=1m"}
        "400":
          description: Неподдерживаемый интервал или тип инструмента.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: {code: INVALID_INTERVAL, message: "Неподдерживаемый таймфрейм '2h'. Доступные: 1m, 5m, 15m, 30m, 1h, 4h, 1d, 1w, 1M"}

  /api/v1/history/downloads/selection:
    post:
      tags: [downloads]
      summary: Предпросмотр загрузки акции, фьючерса или серии
      description: |
        Принимает то же тело, что создание загрузки: target, range, intervals.
        Возвращает полный план «инструмент × интервал»: фактическое окно,
        доступность периода, имеющиеся данные и ожидаемый результат (загрузка,
        пропуск либо недоступность). Исключённые инструменты перечислены с причиной.

        Для акции окно — запрошенный период; для фьючерса — полная жизнь
        контракта, пересекающего range. Нужные карточки получает сервис, включая
        истёкшие фьючерсы. Свечи не скачиваются и ресурс загрузки не создаётся,
        но метаданные могут обновляться. Требует TINKOFF_TOKEN.

        coverage=complete означает подтверждённую доступность требуемых данных,
        а не совпадение крайних свечей. При отсутствии доказательства возвращается
        unknown и сервис планирует проверку. Отсутствие торгов не считается дырой,
        если подтверждено календарём или источником. Доступность данных unknown
        означает, что окончательный результат определится при загрузке.
      operationId: previewDownloadSelection
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadCreateRequest"
            examples:
              share:
                value:
                  target: {instrument_type: share, ticker: SBER}
                  range: {from: "2025-01-01", to: "2025-12-31"}
                  intervals: [1d, 1h]
              series:
                value:
                  target: {instrument_type: future, base_asset: NG}
                  range: {from: "2025-01-01", to: "2025-12-31"}
                  intervals: [1d]
      responses:
        "200":
          description: План выборки.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadSelectionResponse"
              examples:
                share:
                  value:
                    target: {instrument_type: share, ticker: SBER}
                    range: {from: "2025-01-01 00:00:00", to: "2025-12-31 23:59:59"}
                    intervals: [1d]
                    summary: {instruments: 1, items_total: 1, items_already_covered: 0, items_to_fetch: 1, items_unavailable: 0}
                    items:
                      - instrument_type: share
                        ticker: SBER
                        short_name: null
                        interval: 1d
                        window: {from: "2025-01-01 00:00:00", to: "2025-12-31 23:59:59"}
                        availability: {status: available, available_window: {from: "2025-01-01 00:00:00", to: "2025-12-31 23:59:59"}}
                        coverage: {status: missing, count: 0}
                        action: download
                        _links: {instrument: {href: /api/v1/instruments/share/SBER}}
                    excluded: []
                    _links:
                      self: {href: /api/v1/history/downloads/selection, method: POST}
                      download: {href: /api/v1/history/downloads, method: POST}
                future:
                  value:
                    target: {instrument_type: future, ticker: NG-1.26}
                    range: {from: "2025-11-01 00:00:00", to: "2026-01-15 23:59:59"}
                    intervals: [1d]
                    summary: {instruments: 1, items_total: 1, items_already_covered: 1, items_to_fetch: 0, items_unavailable: 0}
                    items:
                      - instrument_type: future
                        ticker: NG-1.26
                        short_name: NG-1.26
                        interval: 1d
                        window: {from: "2025-11-05 00:00:00", to: "2025-12-23 18:45:00"}
                        availability: {status: available, available_window: {from: "2025-11-05 00:00:00", to: "2025-12-23 18:45:00"}}
                        coverage: {status: complete, count: 34}
                        action: skip
                        reason: {code: ALREADY_AVAILABLE, message: Требуемые данные уже доступны.}
                    excluded: []
                    _links:
                      self: {href: /api/v1/history/downloads/selection, method: POST}
                      download: {href: /api/v1/history/downloads, method: POST}
        "400":
          description: Некорректное тело запроса.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: {code: VALIDATION_ERROR, message: Проверка запроса не пройдена.}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DownloadTargetNotFound"
        "409":
          $ref: "#/components/responses/DownloadTargetConflict"
        "502":
          $ref: "#/components/responses/TinkoffUnavailable"
        "503":
          $ref: "#/components/responses/DownloadMetadataUnavailable"

  /api/v1/history/downloads:
    post:
      tags: [downloads]
      summary: Создать загрузку свечей акций или фьючерсов
      description: |
        Фасад: принимает бизнес-задачу и запускает её в фоне, отвечая сразу 202.

        `target.instrument_type` обязателен: `share` — акция, `future` — фьючерс.
        ticker задаёт один инструмент; base_asset задаёт серию
        фьючерсов и допустим только для future. Ровно один способ выбора.

        Для акции загружается запрошенный `range`. Для серии фьючерсов `range`
        выбирает контракты по пересечению торгового окна; каждый выбранный
        контракт загружается за полную жизнь. Один фьючерс по тикеру также
        загружается за полную жизнь; его торговое окно должно пересекать `range`.
        Фактические окна по интервалам доступны в результатах загрузки.

        Сервис сам получает нужные метаданные, проверяет имеющиеся данные,
        догружает отсутствующее и собирает отчёт. Предварительная ручная
        синхронизация каталога не требуется. Клиент не задаёт внутренние политики.

        До ответа проверяются структура, тип/цель, даты и доступность исполнителя.
        Разрешение цели и получение данных выполняются в фоне. Неизвестная цель,
        неоднозначный тикер или недоступный период после 202 отражаются в error
        ресурса либо в ошибках пунктов; HTTP-ответ создания задним числом не меняется.
        Если акция имеет лишь часть истории, доступная часть загружается, а
        availability=partial с HISTORY_DEPTH_LIMIT отражает ограничение. Если
        доступного периода нет, пункт failed с PERIOD_NOT_AVAILABLE. Периоды без
        торгов не заполняются искусственными свечами; подтверждённое отсутствие
        торгов может дать skipped с NO_TRADES/MARKET_CLOSED и нулевыми счётчиками.

        Полнота подтверждается исполнением и сведениями поставщика о торгах,
        а не только крайними свечами. Неопределённое покрытие проверяется сервисом.
        Повторный POST не обновляет уже успешно загруженные данные и не возобновляет
        отменённую загрузку; для failed/cancelled используется возвращённая retry-ссылка.

        Повторный идентичный запрос идемпотентен и возвращает существующий ресурс
        (200 вместо 202). `download_id` — непрозрачный идентификатор: вычислять его
        на стороне клиента не нужно. Создание требует `TINKOFF_TOKEN`.
      operationId: createDownload
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadCreateRequest"
            examples:
              series:
                summary: Серия по базовому активу
                value:
                  target: {instrument_type: future, base_asset: NG}
                  range: {from: "2025-01-01", to: "2025-12-31"}
                  intervals: [1d, 1h]
              contract:
                summary: Один контракт по тикеру
                value:
                  target: {instrument_type: future, ticker: NG-1.26}
                  range: {from: "2025-11-01", to: "2026-01-15"}
                  intervals: [1d]
              share:
                summary: Свечи акции SBER за запрошенный период
                value:
                  target: {instrument_type: share, ticker: SBER}
                  range: {from: "2025-01-01", to: "2025-12-31"}
                  intervals: [1d, 1h]
      responses:
        "202":
          description: Загрузка принята; работа идёт в фоне.
          headers:
            Location:
              description: URL созданного ресурса загрузки.
              schema: {type: string}
              example: /api/v1/history/downloads/dr_5f2c9a1b8e7d
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadResource"
              example:
                download_id: dr_5f2c9a1b8e7d
                target: {instrument_type: future, base_asset: NG}
                range: {from: "2025-01-01 00:00:00", to: "2025-12-31 23:59:59"}
                intervals: [1d, 1h]
                status: pending
                summary: {instruments: 13, items_total: 26, items_pending: 22, items_running: 0, items_completed: 0, items_skipped: 4, items_failed: 0, items_cancelled: 0}
                attempt: 1
                created_at: "2025-12-30 10:00:00"
                started_at: null
                finished_at: null
                _links:
                  self: {href: /api/v1/history/downloads/dr_5f2c9a1b8e7d}
                  items: {href: /api/v1/history/downloads/dr_5f2c9a1b8e7d/items}
                  report: {href: /api/v1/history/downloads/dr_5f2c9a1b8e7d/report}
                  cancel: {href: /api/v1/history/downloads/dr_5f2c9a1b8e7d/cancel, method: POST}
                  collection: {href: /api/v1/history/downloads}
        "200":
          description: Идентичная загрузка уже существует (идемпотентный повтор).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadResource"
        "400":
          description: Некорректное тело запроса.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: {code: VALIDATION_ERROR, message: Проверка запроса не пройдена.}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/DownloadServiceUnavailable"
    get:
      tags: [downloads]
      summary: Журнал загрузок
      description: |
        Журнал загрузок с фильтрами, read-only, без обращения к Tinkoff.
        Первая страница фиксирует состав выборки и порядок (свежие сверху).
        Новые загрузки не добавляются в её продолжение; значения статусов могут
        обновляться. Для нового состава клиент начинает листание заново.
        Клиент следует _links.next; ссылка сохраняет все фильтры и limit.
        next_cursor непрозрачен и не вычисляется из идентификаторов или времени.
      operationId: listDownloads
      x-status: implemented
      parameters:
        - name: instrument_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DownloadInstrumentType"
        - name: ticker
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PublicTicker"
          example: SBER
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DownloadStatus"
        - name: base_asset
          in: query
          required: false
          schema: {type: string}
          example: NG
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: cursor
          in: query
          required: false
          description: Непрозрачное значение next_cursor; предпочтительно следовать готовой ссылке _links.next.
          schema: {type: string, nullable: true}
      responses:
        "200":
          description: Список загрузок.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadResourceList"
              example:
                count: 1
                total: 2
                next_cursor: opaque-journal-token
                downloads:
                  - download_id: dr_sber_2025
                    target: {instrument_type: share, ticker: SBER}
                    range: {from: "2025-01-01 00:00:00", to: "2025-12-31 23:59:59"}
                    intervals: [1d]
                    status: completed
                    summary: {instruments: 1, items_total: 1, items_pending: 0, items_running: 0, items_completed: 1, items_skipped: 0, items_failed: 0, items_cancelled: 0}
                    attempt: 1
                    created_at: "2026-01-01 10:00:00"
                    started_at: "2026-01-01 10:00:01"
                    finished_at: "2026-01-01 10:02:00"
                    _links:
                      self: {href: /api/v1/history/downloads/dr_sber_2025}
                      items: {href: /api/v1/history/downloads/dr_sber_2025/items}
                      report: {href: /api/v1/history/downloads/dr_sber_2025/report}
                _links:
                  self: {href: "/api/v1/history/downloads?instrument_type=share&limit=1"}
                  next: {href: "/api/v1/history/downloads?instrument_type=share&limit=1&cursor=opaque-journal-token"}
        "400":
          $ref: "#/components/responses/DownloadPageInvalid"

  /api/v1/history/downloads/{download_id}:
    get:
      tags: [downloads]
      summary: Статус загрузки
      description: |
        Текущий статус, сводка по пунктам и допустимые действия в _links.
        error описывает общий сбой до построения плана. Сбои отдельных пунктов
        находятся в items/report. Не требует Tinkoff. При перезапуске сервиса
        незавершённое исполнение восстанавливается с тем же download_id.
      operationId: getDownload
      x-status: implemented
      parameters:
        - name: download_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Ресурс загрузки.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadResource"
              example:
                download_id: dr_5f2c9a1b8e7d
                target: {instrument_type: future, base_asset: NG}
                range: {from: "2025-01-01 00:00:00", to: "2025-12-31 23:59:59"}
                intervals: [1d, 1h]
                status: running
                summary: {instruments: 13, items_total: 26, items_pending: 11, items_running: 1, items_completed: 10, items_skipped: 4, items_failed: 0, items_cancelled: 0}
                attempt: 1
                created_at: "2025-12-30 10:00:00"
                started_at: "2025-12-30 10:00:05"
                finished_at: null
                _links:
                  self: {href: /api/v1/history/downloads/dr_5f2c9a1b8e7d}
                  items: {href: /api/v1/history/downloads/dr_5f2c9a1b8e7d/items}
                  report: {href: /api/v1/history/downloads/dr_5f2c9a1b8e7d/report}
                  cancel: {href: /api/v1/history/downloads/dr_5f2c9a1b8e7d/cancel, method: POST}
        "404":
          $ref: "#/components/responses/DownloadNotFound"

  /api/v1/history/downloads/{download_id}/items:
    get:
      tags: [downloads]
      summary: Пункты отчёта загрузки
      description: |
        Построчный результат «инструмент × интервал» с фактическим окном, счётчиками и
        результатом загрузки. Постраничная выдача через _links.next; ссылка
        сохраняет status и limit. Состав страницы фиксируется для последовательности
        листания; текущие состояния пунктов могут обновляться. Ошибка привязана
        к instrument_type, ticker, interval и window, а не к внутреннему номеру строки.
        Счётчики свечей накопительные за все попытки загрузки. Не требует Tinkoff.
      operationId: listDownloadItems
      x-status: implemented
      parameters:
        - name: download_id
          in: path
          required: true
          schema: {type: string}
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DownloadItemStatus"
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: cursor
          in: query
          required: false
          description: Непрозрачное значение `next_cursor` прошлого ответа; клиент передаёт его без разбора и вычислений.
          schema: {type: string, nullable: true}
      responses:
        "200":
          description: Страница пунктов.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadItemList"
              example:
                download_id: dr_5f2c9a1b8e7d
                count: 2
                next_cursor: "opaque-page-token"
                total: 26
                items:
                  - instrument_type: future
                    ticker: NG-2.25
                    interval: 1d
                    window: {from: "2024-12-05 00:00:00", to: "2025-01-16 18:45:00"}
                    status: completed
                    availability: {status: available}
                    candles_received: 31
                    candles_added: 31
                    error: null
                  - instrument_type: future
                    ticker: NG-2.25
                    interval: 1h
                    window: {from: "2024-12-05 00:00:00", to: "2025-01-16 18:45:00"}
                    status: running
                    availability: {status: available}
                    candles_received: 210
                    candles_added: 210
                    error: null
                _links:
                  self: {href: /api/v1/history/downloads/dr_5f2c9a1b8e7d/items}
                  next: {href: "/api/v1/history/downloads/dr_5f2c9a1b8e7d/items?limit=2&cursor=opaque-page-token"}
                  report: {href: /api/v1/history/downloads/dr_5f2c9a1b8e7d/report}
        "404":
          $ref: "#/components/responses/DownloadNotFound"

        "400":
          $ref: "#/components/responses/DownloadPageInvalid"

  /api/v1/history/downloads/{download_id}/report:
    get:
      tags: [downloads]
      summary: Сводный отчёт загрузки
      description: |
        Итоги прогона: статус, длительность, агрегаты по свечам и список ошибок по
        пунктам. Доступен также до завершения: счётчики отражают текущую работу.
        Счётчики свечей накопительные за все попытки; времена и длительность
        относятся к текущей попытке. errors содержит только текущие ошибки пунктов,
        error — общую ошибку разрешения цели. При доступном повторе есть retry.
      operationId: getDownloadReport
      x-status: implemented
      parameters:
        - name: download_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Отчёт.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadReport"
              example:
                download_id: dr_5f2c9a1b8e7d
                status: partial
                attempt: 1
                started_at: "2025-12-30 10:00:05"
                finished_at: "2025-12-30 11:42:10"
                duration_seconds: 6125
                totals: {instruments: 13, items_total: 26, items_pending: 0, items_running: 0, items_skipped: 4, items_completed: 21, items_failed: 1, items_cancelled: 0, candles_received: 190002, candles_added: 182345}
                errors:
                  - instrument_type: future
                    ticker: NG-1.26
                    interval: 1h
                    window: {from: "2025-11-05 00:00:00", to: "2025-12-23 18:45:00"}
                    code: TINKOFF_UNAVAILABLE
                    message: "Свечи NG-1.26 1h: поставщик временно недоступен."
                _links:
                  self: {href: /api/v1/history/downloads/dr_5f2c9a1b8e7d/report}
                  retry: {href: /api/v1/history/downloads/dr_5f2c9a1b8e7d/retry, method: POST}
                  items: {href: /api/v1/history/downloads/dr_5f2c9a1b8e7d/items}
        "404":
          $ref: "#/components/responses/DownloadNotFound"

  /api/v1/history/downloads/{download_id}/cancel:
    post:
      tags: [downloads]
      summary: Отменить загрузку
      description: |
        При pending/running принимает кооперативную отмену (202), переводит
        ресурс в cancelling; текущая операция может ещё завершаться. Затем ресурс
        становится cancelled. Не начавшиеся и прерванные пункты получают cancelled;
        completed/skipped/failed и уже сохранённые свечи сохраняются.
        Повтор при cancelling возвращает 202 без второго запроса отмены;
        повтор при cancelled возвращает 200. Другие терминальные статусы — 409.
        Не требует обращения к Tinkoff. Окончательный статус смотрят по Location.
      operationId: cancelDownload
      x-status: implemented
      parameters:
        - name: download_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "202":
          description: Отмена принята, исполнение ещё может завершаться.
          headers:
            Location:
              schema: {type: string}
              example: /api/v1/history/downloads/dr_sber_2025
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadResource"
              example:
                download_id: dr_sber_2025
                target: {instrument_type: share, ticker: SBER}
                range: {from: "2025-01-01 00:00:00", to: "2025-12-31 23:59:59"}
                intervals: [1d, 1h]
                status: cancelling
                summary: {instruments: 1, items_total: 2, items_pending: 0, items_running: 1, items_completed: 1, items_skipped: 0, items_failed: 0, items_cancelled: 0}
                attempt: 1
                created_at: "2026-01-01 10:00:00"
                started_at: "2026-01-01 10:00:01"
                finished_at: null
                _links:
                  self: {href: /api/v1/history/downloads/dr_sber_2025}
                  items: {href: /api/v1/history/downloads/dr_sber_2025/items}
                  report: {href: /api/v1/history/downloads/dr_sber_2025/report}
        "200":
          description: Загрузка уже отменена; повтор идемпотентен.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadResource"
              example:
                download_id: dr_sber_2025
                target: {instrument_type: share, ticker: SBER}
                range: {from: "2025-01-01 00:00:00", to: "2025-12-31 23:59:59"}
                intervals: [1d, 1h]
                status: cancelled
                summary: {instruments: 1, items_total: 2, items_pending: 0, items_running: 0, items_completed: 1, items_skipped: 0, items_failed: 0, items_cancelled: 1}
                attempt: 1
                created_at: "2026-01-01 10:00:00"
                started_at: "2026-01-01 10:00:01"
                finished_at: "2026-01-01 10:01:00"
                _links:
                  self: {href: /api/v1/history/downloads/dr_sber_2025}
                  items: {href: /api/v1/history/downloads/dr_sber_2025/items}
                  report: {href: /api/v1/history/downloads/dr_sber_2025/report}
                  retry: {href: /api/v1/history/downloads/dr_sber_2025/retry, method: POST}
        "404":
          $ref: "#/components/responses/DownloadNotFound"
        "409":
          description: Загрузку нельзя отменить в текущем статусе.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadError"
              example:
                error: {code: INVALID_STATE, message: "Загрузка уже завершена."}

  /api/v1/history/downloads/{download_id}/retry:
    post:
      tags: [downloads]
      summary: Повторить неуспешную или отменённую загрузку
      description: |
        Допустим при partial/failed/cancelled: ставит в работу только failed и
        cancelled, сохраняя completed/skipped. Если план ещё не построен,
        повторяет разрешение цели. Возвращает 202 с тем же download_id,
        увеличенным attempt и статусом pending; свечевые счётчики не обнуляются.
        Текущие ошибки повторяемых пунктов очищаются. Требует Tinkoff.
        При pending/running/cancelling, completed или отсутствии повторяемой
        работы — 409. Конкурентный повтор не запускает второй набор задач.
      operationId: retryDownload
      x-status: implemented
      parameters:
        - name: download_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "202":
          description: Повтор принят.
          headers:
            Location:
              schema: {type: string}
              example: /api/v1/history/downloads/dr_sber_2025
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadResource"
              example:
                download_id: dr_sber_2025
                target: {instrument_type: share, ticker: SBER}
                range: {from: "2025-01-01 00:00:00", to: "2025-12-31 23:59:59"}
                intervals: [1d, 1h]
                status: pending
                summary: {instruments: 1, items_total: 2, items_pending: 1, items_running: 0, items_completed: 1, items_skipped: 0, items_failed: 0, items_cancelled: 0}
                attempt: 2
                created_at: "2026-01-01 10:00:00"
                started_at: null
                finished_at: null
                _links:
                  self: {href: /api/v1/history/downloads/dr_sber_2025}
                  items: {href: /api/v1/history/downloads/dr_sber_2025/items}
                  report: {href: /api/v1/history/downloads/dr_sber_2025/report}
                  cancel: {href: /api/v1/history/downloads/dr_sber_2025/cancel, method: POST}
        "404":
          $ref: "#/components/responses/DownloadNotFound"
        "409":
          description: Нет повторяемой работы или загрузка ещё выполняется.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadError"
              example:
                error: {code: INVALID_STATE, message: "Нет неуспешной или отменённой работы для повторения."}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/DownloadServiceUnavailable"

  /api/v1/market-import/status:
