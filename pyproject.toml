[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "historical-broker-api-emulator"
dynamic = ["version"]
description = "Local historical market data provider compatible with the existing trading robot's Tinkoff Invest API contract."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "t-tech-investments>=1.49.3",
]

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pandas>=2.2",
    "httpx>=0.27",
    "pyinstaller>=6.6",
    "pyinstaller-hooks-contrib>=2024.6",
]

[project.scripts]
historical-broker = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
